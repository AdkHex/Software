<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordPress Software Post Generator</title>
  <link rel="icon" href="https://i.pinimg.com/736x/9c/0b/ca/9c0bca9ed55b442248c105d680c77114.jpg" type="image/x-icon" />

  <style>
    :root{
      /* TRUE BLACK THEME */
      --bg-color:#000000;
      --card-bg:#020202;
      --input-bg:#000000;

      --primary-accent:#00f5ff;
      --primary-hover:#49fbff;

      --success-color:#00ff88;

      --heading-color:#ffffff;
      --text-color:#b3b3b3;

      --border-color:#1a1a1a;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:'Lexend',system-ui,-apple-system,sans-serif;
      line-height:1.6;
      color:var(--text-color);
      background:var(--bg-color);
      padding:20px;
    }

    h1,h2,h3,label{color:var(--heading-color)}
    label,.section-title,.output-box h3{display:flex;align-items:center;gap:10px}

    .container{
      display:flex;
      gap:30px;
      max-width:1400px;
      margin:0 auto;
    }

    .input-section,.output-section{
      flex:1;
      background:var(--card-bg);
      padding:25px;
      border-radius:12px;
      border:1px solid var(--border-color);
    }

    .form-group{margin-bottom:18px}

    label{
      font-weight:400;
      font-size:.9rem;
      margin-bottom:8px;
    }

    input[type="text"], textarea{
      width:100%;
      padding:12px;
      border:1px solid var(--border-color);
      border-radius:10px;
      font-size:14px;
      background:var(--input-bg);
      color:var(--heading-color);
      transition:all .2s ease-in-out;
      font-family:'Lexend',sans-serif;
    }

    input[type="text"]::placeholder, textarea::placeholder{
      color:#666;
      opacity:1;
    }

    input[type="text"]:focus, textarea:focus{
      outline:none;
      border-color:var(--primary-accent);
      box-shadow:0 0 0 3px rgba(0,245,255,.25);
    }

    textarea{min-height:120px;resize:vertical}

    .two-column{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .section-title{
      color:var(--heading-color);
      font-weight:700;
      margin:18px 0 14px;
    }

    .output-box{
      margin-top:25px;
      padding:16px;
      background:var(--bg-color);
      border-radius:10px;
      border:1px solid var(--border-color);
    }

    .output-box:first-child{margin-top:0}

    .output-box h3{
      font-size:16px;
      font-weight:700;
      margin-bottom:12px;
    }

    .output-box input,
    .output-box textarea{
      background:var(--input-bg);
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      cursor:pointer;
      transition:all .2s ease;
    }

    .output-box input:focus,
    .output-box textarea:focus{
      border-color:var(--success-color);
      box-shadow:0 0 0 3px rgba(0,255,136,.18);
    }

    .output-box input.copied,
    .output-box textarea.copied{
      border-color:var(--success-color);
      background:rgba(0,255,136,.08);
    }

    /* WordPress textarea HALF original (400px -> 200px) */
    .output-box textarea{
      height:200px;
    }

    /* keep 4 output inputs in separate row */
    .output-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
      margin-top:20px;
    }

    .output-grid .output-box{
      margin-top:0;
      padding:15px;
    }

    .output-grid .output-box h3{
      font-size:15px;
      margin-bottom:10px;
    }

    .copy-notification{
      position:fixed;
      top:20px;
      right:20px;
      background:var(--success-color);
      color:#000;
      padding:12px 20px;
      border-radius:10px;
      font-weight:700;
      z-index:1000;
      opacity:0;
      transform:translateY(-20px);
      transition:opacity .3s, transform .3s;
      box-shadow:0 8px 18px rgba(0,0,0,.35);
    }

    .copy-notification.show{
      opacity:1;
      transform:translateY(0);
    }

    @media (max-width:1200px){
      .container{flex-direction:column}
    }

    @media (max-width:768px){
      body{padding:15px}
      .two-column{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="input-section">

      <div class="two-column">
        <div class="form-group">
          <label for="softwareName">💻 Software Name:</label>
          <input type="text" id="softwareName" placeholder="Enter software name" />
        </div>

        <div class="form-group">
          <label for="developer">👨‍💻 Developer:</label>
          <input type="text" id="developer" placeholder="Enter developer name" />
        </div>
      </div>

      <div class="two-column">
        <div class="form-group">
          <label for="versionNumber">🔖 Version Number:</label>
          <input type="text" id="versionNumber" placeholder="e.g., 1.2 (without 'v')" />
        </div>

        <div class="form-group">
          <label for="versionExtra">ℹ️ Version Extra Info (optional):</label>
          <input type="text" id="versionExtra" placeholder="e.g., | build 69 or + Update 3" />
        </div>
      </div>

      <!-- SIZE + PURPOSE side-by-side (purpose is INPUT) -->
      <div class="two-column">
        <div class="form-group">
          <label for="size">💾 Size:</label>
          <input type="text" id="size" placeholder="e.g., 1.0GB" />
        </div>

        <div class="form-group">
          <label for="purpose">🎯 Purpose:</label>
          <input type="text" id="purpose" placeholder="e.g., video editing, system optimization" />
        </div>
      </div>

      <!-- Description full width -->
      <div class="form-group">
        <label for="detailedDescription">📝 Description:</label>
        <textarea id="detailedDescription" placeholder="Enter detailed description"></textarea>
      </div>

      <div class="optional-section">
        <div class="section-title">✨ Optional Sections</div>

        <div class="form-group">
          <label for="instructions">🛠️ Instructions:</label>
          <textarea id="instructions" placeholder="Enter instructions (one per line)"></textarea>
        </div>

        <div class="form-group">
          <label for="features">⭐ Features:</label>
          <textarea id="features" placeholder="Enter features"></textarea>
        </div>

        <div class="form-group">
          <label for="crackInfo">📌 Crack Info:</label>
          <textarea id="crackInfo" placeholder="Enter crack information"></textarea>
        </div>
      </div>
    </div>

    <div class="output-section">
      <div class="output-box">
        <h3>📄 WordPress Post Code:</h3>
        <textarea id="outputCode" readonly onclick="copyToClipboard('outputCode', this)"></textarea>
        <p style="margin-top:10px;font-size:13px;color:var(--text-color);text-align:center;">
          Click on the code box to copy
        </p>
      </div>

      <div class="output-grid">
        <div class="output-box">
          <h3>🔽 Download Title:</h3>
          <input type="text" id="downloadTitle" readonly onclick="copyToClipboard('downloadTitle', this)" />
        </div>

        <div class="output-box">
          <h3>🔑 Focus Keyphrase:</h3>
          <input type="text" id="focusKeyphrase" readonly onclick="copyToClipboard('focusKeyphrase', this)" />
        </div>

        <div class="output-box">
          <h3>🔗 Slug:</h3>
          <input type="text" id="slug" readonly onclick="copyToClipboard('slug', this)" />
        </div>

        <div class="output-box">
          <h3>🖼️ Image Renamer:</h3>
          <input type="text" id="imageRenamer" readonly onclick="copyToClipboard('imageRenamer', this)" />
        </div>
      </div>
    </div>
  </div>

  <div id="copyNotification" class="copy-notification">Copied to clipboard!</div>

  <script>
    // All input ids (SOURCE removed)
    const inputElements = [
      'softwareName', 'developer', 'versionNumber', 'versionExtra',
      'size', 'purpose', 'detailedDescription',
      'instructions', 'features', 'crackInfo'
    ];

    inputElements.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', generateCode);
        el.addEventListener('change', generateCode);
      }
    });

    generateCode();

    function generateCode() {
      const softwareName = document.getElementById('softwareName').value.trim();
      const developer = document.getElementById('developer').value.trim();
      const versionNumberInput = document.getElementById('versionNumber').value.trim();
      const versionExtra = document.getElementById('versionExtra').value.trim();
      const size = document.getElementById('size').value.trim();
      const purpose = document.getElementById('purpose').value.trim(); // purpose is INPUT now
      const instructions = document.getElementById('instructions').value.trim();
      const features = document.getElementById('features').value.trim();
      const crackInfo = document.getElementById('crackInfo').value.trim();
      const detailedDescription = document.getElementById('detailedDescription').value.trim();

      // Download Title
      let downloadTitle = 'Download ' + (softwareName || 'Software');

      if (versionNumberInput) {
        let formattedVersion = versionNumberInput.startsWith('v') ? versionNumberInput : 'v' + versionNumberInput;
        if (versionExtra) {
          formattedVersion = ` (${formattedVersion} ${versionExtra})`;
        } else {
          formattedVersion = ` (${formattedVersion})`;
        }
        downloadTitle += formattedVersion;
      }

      document.getElementById('downloadTitle').value = downloadTitle;

      // Focus Keyphrase
      document.getElementById('focusKeyphrase').value = softwareName ? `Download ${softwareName}` : 'Download Software';

      // Slug
      let slug = (softwareName || 'software').toLowerCase()
        .replace(/[^\w\s]/gi, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
      document.getElementById('slug').value = slug;

      // Image Renamer (.png)
      document.getElementById('imageRenamer').value = `download-${slug}.png`;

      // Software Info list (SOURCE removed)
      let softwareInfoList = '';

      if (softwareName) {
        softwareInfoList += `<!-- wp:list-item -->
<li><strong>Name</strong>: ${softwareName}</li>
<!-- /wp:list-item -->

`;
      }

      if (versionNumberInput) {
        softwareInfoList += `<!-- wp:list-item -->
<li><strong>Version</strong>: v${versionNumberInput}</li>
<!-- /wp:list-item -->

`;
      }

      if (developer) {
        softwareInfoList += `<!-- wp:list-item -->
<li><strong>Developer</strong>: ${developer}</li>
<!-- /wp:list-item -->

`;
      }

      if (size) {
        softwareInfoList += `<!-- wp:list-item -->
<li><strong>Size</strong>: ${size}</li>
<!-- /wp:list-item -->

`;
      }

      if (softwareInfoList) softwareInfoList = softwareInfoList.trim();

      // Intro paragraph
      let introParagraph = `<p><strong>Download${softwareName ? ' ' + softwareName : ''} for Windows FREE</strong>.`;

      if (softwareName || versionNumberInput || developer || purpose) {
        introParagraph += ' Here is a direct link to download ';

        if (softwareName) introParagraph += softwareName;
        if (versionNumberInput) introParagraph += ` latest version (v${versionNumberInput})`;

        introParagraph += ' for free.';

        if (developer) introParagraph += ` ${softwareName} is developed by ${developer} and`;
        if (purpose) introParagraph += ` is considered one of the best software for ${purpose}`;
      }

      introParagraph += '</p>';

      // Instructions section
      let instructionsSection = '';
      if (instructions) {
        const lines = instructions.split('\n').filter(line => line.trim() !== '');
        if (lines.length > 0) {
          instructionsSection = `
<!-- wp:heading -->
<h2 class="wp-block-heading">Instructions</h2>
<!-- /wp:heading -->

<!-- wp:list -->
<ul class="wp-block-list">`;

          for (let i = 0; i < lines.length; i++) {
            instructionsSection += `<!-- wp:list-item -->
<li>${lines[i]}</li>
<!-- /wp:list-item -->

`;
          }

          instructionsSection += `</ul>
<!-- /wp:list -->
`;
        }
      }

      // Features section
      let featuresSection = '';
      if (features) {
        featuresSection = `
<!-- wp:heading -->
<h2 class="wp-block-heading">Features</h2>
<!-- /wp:heading -->

<!-- wp:paragraph -->
<p>${features}</p>
<!-- /wp:paragraph -->
`;
      }

      // Crack info section
      let crackInfoSection = '';
      if (crackInfo) {
        crackInfoSection = `
<!-- wp:heading -->
<h2 class="wp-block-heading">Crack Info</h2>
<!-- /wp:heading -->

<!-- wp:paragraph -->
<p>${crackInfo}</p>
<!-- /wp:paragraph -->
`;
      }

      // Description section
      let detailedDescriptionSection = '';
      if (detailedDescription) {
        detailedDescriptionSection = `<!-- wp:heading -->
<h2 class="wp-block-heading">Description</h2>
<!-- /wp:heading -->

<!-- wp:paragraph -->
<p>${detailedDescription}</p>
<!-- /wp:paragraph -->
`;
      }

      // Complete WordPress code
      let code = `<!-- wp:paragraph -->
${introParagraph}
<!-- /wp:paragraph -->`;

      if (softwareInfoList) {
        code += `

<!-- wp:heading -->
<h2 class="wp-block-heading">Software Info</h2>
<!-- /wp:heading -->

<!-- wp:list -->
<ul class="wp-block-list">${softwareInfoList}
<!-- wp:list-item -->
<li><strong><mark style="background-color:rgba(0, 0, 0, 0)" class="has-inline-color has-theme-palette-2-color">Password</mark></strong>: GamesLeech or SoftwareLeech</li>
<!-- /wp:list-item --></ul>
<!-- /wp:list -->`;
      }

      // Download section
      code += `

<!-- wp:heading {"textAlign":"center","className":"dl_head"} -->
<h2 class="wp-block-heading has-text-align-center dl_head">${downloadTitle} for Free</h2>
<!-- /wp:heading -->

<!-- wp:group {"className":"dl_grp","layout":{"type":"constrained"}} -->
<div class="wp-block-group dl_grp"><!-- wp:shortcode -->
[su_spoiler class="file-spoiler" title="Download as File" open="yes" icon="arrow" style="fancy"]
<!-- /wp:shortcode -->

<!-- wp:paragraph -->
<p></p>
<!-- /wp:paragraph -->

<!-- wp:shortcode -->
[/su_spoiler]
<!-- /wp:shortcode --></div>
<!-- /wp:group -->
${instructionsSection}
<!-- wp:shortcode -->
[su_spoiler class="description-spoiler" title="Description" icon="plus" style="fancy"]
<!-- /wp:shortcode -->
`;

      if (featuresSection || crackInfoSection || detailedDescriptionSection) {
        code += `${featuresSection}${crackInfoSection}
${detailedDescriptionSection}`;
      }

      code += `
<!-- wp:shortcode -->
[/su_spoiler]
<!-- /wp:shortcode -->

<!-- wp:paragraph -->
<p></p>
<!-- /wp:paragraph -->`;

      document.getElementById('outputCode').value = code;
    }

    function copyToClipboard(elementId, element) {
      const copyElement = document.getElementById(elementId);

      if (copyElement.tagName === 'INPUT' || copyElement.tagName === 'TEXTAREA') {
        copyElement.select();
        copyElement.setSelectionRange(0, 99999);
      } else {
        const range = document.createRange();
        range.selectNode(copyElement);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      }

      document.execCommand('copy');
      window.getSelection().removeAllRanges();

      if (element) {
        element.classList.add('copied');
        setTimeout(() => element.classList.remove('copied'), 900);
      }

      const notification = document.getElementById('copyNotification');
      notification.classList.add('show');
      setTimeout(() => notification.classList.remove('show'), 1600);
    }
  </script>
</body>
</html>
